spring.application.name=resource-booking-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
server.error.include-binding-errors=never

app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html